<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topic Question Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container">
      <h1>Topic Question Generator</h1>
      <p class="subtitle">Enter a topic and get 5 thoughtful questions.</p>

      <form method="POST" action="/">
        <label for="topic">Topic</label>
        <input
          id="topic"
          name="topic"
          type="text"
          value="{{ topic if topic else '' }}"
          placeholder="Example: Machine Learning"
          required
        />
        <button type="submit">Generate Questions</button>
      </form>

      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}

      {% if questions %}
      <div class="result-box">
        <h2>Questions for: {{ topic }}</h2>
        <ol>
          {% for q in questions %}
          <li>{{ q }}</li>
          {% endfor %}
        </ol>
      </div>
      {% endif %}
    </div>
  </body>
</html>
